# Render Blueprint for the IsaPay API (ISA Tech Hub, backend/). In Render: New → Blueprint → choose this repo.
# Render asks for every value marked `sync: false` while creating the service.
services:
  - type: web
    name: isa-tech-hub
    runtime: node
    rootDir: backend
    # The free plan sleeps after 15 idle minutes, and a sleeping server misses Safaricom's payment
    # callbacks. Until you move to the Starter plan (always on), the API pings itself every
    # 10 minutes (KEEP_ALIVE below) so it never sleeps. On Starter, set KEEP_ALIVE to "false".
    plan: free
    # Render's closest region to Kenya.
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # A database just for the Hub, e.g. your Atlas cluster with /isa-tech-hub as the database name.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Encrypts the till credentials. Render generates it; copy it somewhere safe as well.
      - key: HUB_SECRET_KEY
        generateValue: true
      # The dashboard's address on Vercel, e.g. https://isa-tech-hub.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
      # Your first dashboard sign-in, created on first start. Delete the password after signing in.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # The ISA till. Same values egertickets uses: MPESA_SHORTCODE = its MPESA_SHORTCODE (store /
      # head office number), MPESA_TILL_NUMBER = its MPESA_STORE_NUMBER (the till customers pay).
      - key: MPESA_ENV
        value: production
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_TILL_NUMBER
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      # More tills: the same variables with _2, _3… (MPESA_SHORTCODE_2, MPESA_TILL_NUMBER_2,
      # MPESA_CONSUMER_KEY_2, MPESA_CONSUMER_SECRET_2, MPESA_PASSKEY_2, optional MPESA_ENV_2 and
      # MPESA_TILL_NAME_2). Each number is its own till, so keys never overlap. Add them in the
      # Environment tab, or add the till in the dashboard (M-Pesa tills → Add till).
      # Keeps the free plan awake: pings https://<service>.onrender.com/health every 10 minutes.
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_EVERY_MINUTES
        value: "10"
